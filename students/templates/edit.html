<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Edit Student</title>
</head>

<body>

    <div class="container shadow mt-5 p-4">

        <div class="card p-4 mb-4">
            <h2 class="text-center text-primary">Edit Student Details

            </h2>

            <form method="POST">

                {% csrf_token %}

                <input type="text" name="name" value="{{ student.name }}" placeholder="Enter Student Name"
                    class="form-control">

                <br><br>

                <input type="text" name="age" value="{{ student.age }}" placeholder="Enter Age" class="form-control">

                <br><br>

                <input type="text" name="course" value="{{ student.course }}" placeholder="Enter course"
                    class="form-control">

                <br><br>

                <button type="submit" class="btn btn-success" class="text-center">Update</button>
            </form>

        </div>

    </div>
</body>

</html>
